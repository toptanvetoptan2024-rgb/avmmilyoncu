# Cloudflare Workers ayarları – AVM Milyoncu
name = "avmmilyoncu"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Cloudflare panelinden eklenen değişkenler her yüklemede silinmesin.
keep_vars = true

# Statik dosyalar: CSS, tarayıcı kodu (js), ürün fotoğrafları (urunler). Cloudflare bu klasörü doğrudan yayınlar.
[assets]
directory = "./public"

# Sipariş, ürün ve reklam veritabanı. İlk yüklemede Cloudflare otomatik oluşturur.
[[d1_databases]]
binding = "DB"
database_name = "avmmilyoncu-db"

# Gizli değerler (ADMIN_PASSWORD gibi) burada DEĞİL, Cloudflare panelinde "Gizli" olarak tutulur.
[vars]
SITE_URL = "https://avmmilyoncu.com"

[observability]
enabled = true
